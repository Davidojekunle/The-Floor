<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="The Floor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f6f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f5" />
    <meta name="description" content="The Floor splits group work into steps with one person on each. Everyone knows when it's their turn, and finished work passes itself on." />
    <title>The Floor – group task manager for teams and classes</title>
    <!-- Search and link previews. The old onrender.com address redirects here (see backend mount_frontend). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Floor" />
    <meta property="og:url" content="https://thefloorapp.me/" />
    <meta property="og:title" content="The Floor – group task manager for teams and classes" />
    <meta property="og:description" content="Split group work into steps with one person on each. Everyone knows when it's their turn, and finished work passes itself on." />
    <meta property="og:image" content="https://thefloorapp.me/icon-512.png" />
    <meta property="og:image:alt" content="The Floor logo: orange hazard stripes on dark grey" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "The Floor",
        "url": "https://thefloorapp.me/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web browser)",
        "description": "A group task manager built around rooms. Work is split into stages that hand off in order, with one person on each.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Applies the saved theme before the first paint (see src/lib/theme.ts). A file, not inline, so the CSP can forbid inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
